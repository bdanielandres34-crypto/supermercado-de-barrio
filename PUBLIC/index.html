<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supermercado de Barrio - Iniciar Sesión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2 class="titulo-login">
      <img src="logo.png" alt="Logo" class="logo-login">
      Iniciar Sesión
    </h2>

    <!-- 🔹 Formulario de inicio de sesión -->
    <form action="/login" method="POST">
      <input type="email" name="correo" placeholder="Correo electrónico" required>
      <input type="password" name="contrasena" placeholder="Contraseña" required>
      <button type="submit">Ingresar</button>
    </form>

    <p id="errorMsg" style="display:none;">Usuario o contraseña incorrectos</p>
    <a href="register.html">¿No tienes cuenta? Regístrate aquí</a>
  </div>
</body>
</html>
