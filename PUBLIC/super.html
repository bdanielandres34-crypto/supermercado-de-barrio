<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supermercado de Barrio</title>
  <link rel="stylesheet" href="super.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header class="navbar">
    <!-- Logo -->
    <div class="logo">
      <img src="logo.png" alt="Logo Supermercado">
    </div>

    <!-- Barra de búsqueda -->
    <div class="busqueda">
      <input type="text" placeholder="Encuentra lo que necesitas en Supermercado de Barrio">
      <button><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <!-- Mi cuenta -->
    <div class="mi-cuenta" id="miCuenta">
      <i class="fa-solid fa-user"></i>
      <div>
        <p>¡Hola! Inicia sesión</p>
        <strong>Mi cuenta</strong>
      </div>
    </div>

    <!-- Carrito -->
    <div class="carrito" id="carrito">
      <i class="fa-solid fa-cart-shopping"></i>
      <span>Carrito</span>
      <a href="carrito.html" class="carrito">
  🛒 <span id="contador-carrito">0</span>
</a>
    </div>
  </header>

  <script>
    // Redireccionar al login
    document.getElementById("miCuenta").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    // Redireccionar al carrito
    document.getElementById("carrito").addEventListener("click", () => {
      window.location.href = "carrito.html";
    });
  </script>
</body>
</html>

 <main>
    <h1 style="text-align:center;margin-top:60px;">Bienvenido al Supermercado de Barrio</h1>
  </main>

  <!-- MENÚ DE CATEGORÍAS -->
  <div class="menu-categorias" id="menuCategorias">
   <div class="categorias">
      <div class="categoria" onclick="window.location.href='lacteos.html'">
        <img src="super/lacteos.png" alt="Lácteos">
        <p>LÁCTEOS</p>
      </div>

      <div class="categoria" onclick="window.location.href='despensa.html'">
        <img src="super/despensa.png" alt="Despensa">
        <p>DESPENSA</p>
      </div>

      <div class="categoria" onclick="window.location.href='aseo_personal.html'">
        <img src="super/aseop.png" alt="Aseo Personal">
        <p>ASEO PERSONAL</p>
      </div>

      <div class="categoria" onclick="window.location.href='aseo.html'">
        <img src="super/aseo.png" alt="Aseo">
        <p>ASEO</p>
      </div>

      <div class="categoria" onclick="window.location.href='carnes_frias.html'">
        <img src="super/carnes.png" alt="Carnes Frías">
        <p>CARNES FRÍAS</p>
      </div>
    </div>
  </main>
</body>

  <script src="super.js"></script>

  <a href="carrito.html" class="carrito-icono">
  🛒 <span id="contador-carrito">0</span>
</a>

<script src="carrito.js"></script>
<script>actualizarContadorCarrito();</script>

</body>
</html>
